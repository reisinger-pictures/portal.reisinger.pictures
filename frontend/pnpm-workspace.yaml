packages:
  - "."
overrides:
  react-router: 7.18.2
  nanoid: 3.3.18
  brace-expansion: 5.0.12
  # minimatch is transitive via eslint, @eslint/config-array and
  # @typescript-eslint/typescript-estree. 10.2.5 sits inside the vulnerable
  # range of the open advisories; every one of them ends at < 11.0.1, so no
  # 10.x release escapes all ranges. The consumers declare ^10.2.x, hence this
  # override forces the major bump to the lowest unaffected release. Only the
  # `new Minimatch(pattern, opts).match(path, partial)` and `minimatch(path,
  # pattern, opts)` entry points are used here, both unchanged in 11.
  minimatch: 11.0.1
  # svgo is transitive via @iconify/tools <- @iconify/tailwind4 and was pinned
  # to 4.0.2, which falls inside the vulnerable range >= 4.0.0, < 4.1.0 of
  # GHSA-w27v-7q3p-w38r (high) and GHSA-4vpr-x523-8j87. @iconify/tools declares
  # svgo: ^4.0.1, so 4.1.0 satisfies its own range — no forced resolution.
  svgo: 4.1.0
  postcss: 8.5.23
  # undici is transitive via jsdom only (the Vitest test environment).
  # jsdom@30.0.1 declares undici: ^8.9.0, so it resolves to 8.12.2 on its own —
  # and every open undici advisory ends at < 7.29.1 (GHSA-w293-vg96-wgc3 high,
  # GHSA-pmjh-fq2x-6v4x / GHSA-2jfj-6hjv-fm6j medium, GHSA-r53p-7pc4-xj5r /
  # GHSA-2gqq-gqf2-x968 / GHSA-8436-99hf-9mmv low), so 8.x is outside all six
  # ranges. No forced resolution is needed here — deliberately no override.
  # source-map-js is transitive via postcss, css-tree, magicast and
  # @tailwindcss/node; 1.2.1 sits inside the vulnerable range >= 1.0.0, < 1.2.2
  # of GHSA-68fv-2mgg-jv7q (high). Every consumer declares ^1.2.1 or ^1.0.1, so
  # 1.2.2 satisfies their own ranges — no forced resolution.
  source-map-js: 1.2.2
  # postcss-selector-parser is transitive via @tailwindcss/typography, which
  # pins it exactly to 6.0.10 — inside the vulnerable range < 7.1.6 of
  # GHSA-rj75-hqrm-r3gf (medium). The fix exists only in 7.1.6+, so this
  # override forces a major bump; the plugin's API usage is covered by the
  # build, which emits the typography prose selectors.
  postcss-selector-parser: 7.1.6
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
