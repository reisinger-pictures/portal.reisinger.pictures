name: Dependabot Auto-Merge

# Keine Branch Protection vorhanden -> der Workflow wartet selbst auf grüne
# CI-Checks (lewagon/wait-on-check-action), bevor er mergt.
# pull_request_target wird nur mit striktem Actor-Gate auf dependabot[bot]
# verwendet; es wird KEIN untrusted PR-Code ausgecheckt oder ausgeführt
# (nur Metadaten lesen + API-merge), daher im public Repo vertretbar.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Hard total bound: 25 minutes for CI + 35 minutes for check discovery
    # + 5 minutes for checkout/merge headroom = 65 minutes. The action's
    # checks-discovery-timeout is not a total completion timeout, so the job
    # itself must fail closed if the aggregate never completes.
    timeout-minutes: 65
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine whether to merge
        id: should-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          # SECURITY: step outputs are untrusted data and must NEVER be
          # interpolated into the JavaScript source (script injection). Pass
          # them via env and read them from process.env inside the script.
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        with:
          script: |
            const updateType = process.env.UPDATE_TYPE || '';
            // output ist `dependency-group` (singular): ein PR hängt an maximal
            // EINER Dependabot-Gruppe (leer, wenn keine Gruppe aktiv ist)
            const dependencyGroup = process.env.DEPENDENCY_GROUP || '';

            // Minor/Patch-Gruppen sind per Konstruktion sicher (dependabot.yml
            // matcht dort nur update-types minor+patch) - auch wenn die
            // Update-Type-Erkennung bei gruppierten PRs leer bleibt.
            const safeGroup = dependencyGroup === 'minor-and-patch';
            const safeIndividual = ['version-update:semver-minor', 'version-update:semver-patch'].includes(updateType);
            // Docker-Images haben keine zuverlässige semver-Klassifikation
            // und werden bewusst NIE auto-gemergt
            const notDocker = !dependencyGroup.includes('docker');

            // WICHTIG: `return` statt core.setOutput('result', ...) - github-script
            // reserviert den Output-Namen "result" für den Script-Rückgabewert und
            // überschreibt ein manuell gesetztes Output "result" sonst mit "".
            // (Bewiesen im Debug-Lauf 2026-08-25; ohne Fix werden die Merge-Schritte
            // still geskippt, obwohl der Run "success" meldet.)
            return (safeGroup || safeIndividual) && notDocker;

      # running-workflow-name verhindert, dass wait-on-check auf SICH SELBST
      # wartet (der AutomERGE-Run hängt am head-sha).
      # SECURITY: allowed-conclusions ist bewusst NUR "success". Ein
      # übersprungener Check hat nichts verifiziert und darf einen
      # unbeaufsichtigten Auto-Merge nicht freischalten. Sollte je ein
      # legitim übersprungener Pflicht-Check auftauchen, wird der JOB gefixt
      # (nicht das Merge-Gate aufgeweicht).
      # v1.9.1 kennt KEINEN generischen "timeout"-Input. Der
      # checks-discovery-timeout begrenzt nur die Check-Entdeckung; der
      # job-level timeout oben begrenzt die gesamte Warte-/Merge-Kette.
      # Der Push-Aggregatname ist absichtlich exakt: Dependabot-PRs haben
      # zusätzlich einen pull_request-Lauf, dessen secret-dependent E2E und
      # Aggregate-Gate absichtlich übersprungen werden. Nur der Push-Check auf
      # demselben Head-SHA ist autoritativ.
      - name: Wait for CI checks
        if: steps.should-merge.outputs.result == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: automerge
          wait-interval: 60
          # The aggregate may spend up to the 25-minute CI budget before it
          # completes; allow 35 minutes for check discovery before failing closed.
          checks-discovery-timeout: 2100
          # Wait only for the exact push aggregate. Its dynamic event suffix
          # keeps the normal pull_request aggregate distinct; an absent or
          # non-success push dependency still fails closed.
          check-name: 'CI gate (push)'
          allowed-conclusions: success
          # fail-on-no-checks is effective with the exact check-name filter; an
          # absent aggregate check must never authorize an auto-merge.
          fail-on-no-checks: true
          wait-for-duplicates: true

      # pull_request_target checkt per Default KEIN Repo aus -> "gh pr merge"
      # scheitert mit "not a git repository". Daher main auschecken (nur Metadaten/
      # API-Merge, KEIN PR-Code -> weiterhin sicher).
      - name: Checkout main (for gh pr merge)
        if: steps.should-merge.outputs.result == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: .github

      - name: Merge Dependabot PR
        if: steps.should-merge.outputs.result == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # INFRA-9: GitHub-defined integers are not currently exploitable, but
          # the repo policy (tests/infrastructure/ci-security-contract.sh) is to
          # pass untrusted event metadata through env, never inline into a
          # `run:` block. Keep this indirection even though the value is numeric.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
