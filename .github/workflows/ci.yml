name: CI

# Push auf ALLE Branches (inkl. Dependabot-Branches wie
# dependabot/npm_and_yarn/frontend/...). Ein Dependabot-ausgeloester Run — `push`
# UND `pull_request` — erhaelt KEINE Actions-Secrets, sondern die
# **Dependabot**-Secrets; nur `pull_request_target` faellt heraus — und dort
# auch nur, wenn der Base-Ref des PRs von Dependabot stammt. Bei einem
# Dependabot-PR gegen main greift das nicht — deshalb kann `automerge.yml` mit
# `secrets.GITHUB_TOKEN` mergen. Der
# PR-seitige Lauf wird deshalb nicht wegen fehlender Secrets uebersprungen,
# sondern bewusst: die siebenteilige E2E-Matrix soll pro Dependabot-PR einmal
# statt zweimal laufen (Owner-Entscheidung 2026-10-18). Autoritativ ist der
# Push-Lauf auf demselben Head-SHA — `automerge.yml` wartet exakt auf
# `CI gate (push)`. `pull_request` deckt normale Same-Repo-PRs weiterhin
# fail-closed ab.
# Docs-only commits have run all 12 jobs (incl. 6 Playwright shards) — 3352977
# is one example. The trigger block below re-includes `features/infrastructure/**`,
# `features/ai/**`, `features/security/**` and `features/e2e-test-strategy.md`, so
# a doc-only commit inside those trees still runs everything.
# `'**'` is the only positive pattern, so no code
# change can ever be filtered out; the negations drop documentation only. The
# trailing patterns re-include the documentation trees deliberately
# conservative: they cost redundant runs, and a redundant run is loud and
# self-healing, while a filtered-out change is silent. The reason that once
# justified them expired on 2026-10-18: InfrastructureSupplyChainPolicyTest
# stopped scanning prose — the docblock of its containerArtifactFiles() says
# "Prose is deliberately not scanned." — so the ghcr-namespace gate no longer
# reads .md as input, and the re-includes no longer keep image-doc drift
# gated. `main` has deliberately no branch protection (AGENTS.md D-3), so a
# path-filtered run cannot strand a PR on a required check.
# `automerge.yml` is the one consumer a filtered check breaks: it waits for
# `'CI gate (push)'` with `fail-on-no-checks: true`, so a never-reporting check
# stalls `should-merge` to its `timeout-minutes: 65` and fails closed.
# Not reachable today: npm, composer and both docker ecosystems touch manifests,
# never docs alone — so `dependabot.yml` alone holds that invariant, and a new
# `.md`-producing ecosystem is what breaks it.
on:
  push:
    paths:
      - '**'
      - '!**/*.md'
      - 'features/infrastructure/**'
      - 'features/ai/**'
      - 'features/security/**'
      - 'features/e2e-test-strategy.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - 'features/infrastructure/**'
      - 'features/ai/**'
      - 'features/security/**'
      - 'features/e2e-test-strategy.md'

# Least privilege: CI only reads the repository. Secrets are passed directly to
# the jobs that need them and are never printed, fingerprinted, or written to
# artifacts. E2E output is limited to the sanitized step summary: Playwright
# reports, traces, screenshots, videos, and test-results are never uploaded.
#
# GHCR-Sichtbarkeit ist eine harte Voraussetzung, kein Komfort: Die Container-
# Images werden anonym gezogen, also OHNE `packages`-Scope und OHNE
# docker-login (Least Privilege). Das ist technisch nicht umgehbar, weil das
# E2E-Job-`container:`-Image vom Runner VOR dem ersten Step gepullt wird — ein
# Login-Step im Job käme zu spät. Stellt der Org-Owner eines der Pakete wieder
# auf `private`, bricht der Pull mit `unauthorized` ab (Exit 125) und die
# betroffenen Jobs laufen nie. Ist-Zustand, gemessen am 2026-10-15:
# `gh api 'orgs/reisinger-pictures/packages?package_type=container'` meldet
# `portal-base public` und `portal-e2e public` — die Bedingung ist erfüllt.
# Kein Test bewacht sie, und die Sichtbarkeit ist jederzeit zurücksetzbar.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-contract:
    name: CI security contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run security contracts
        run: sh scripts/gates.sh full security

  ratchet:
    # The gates of this repository: the security findings of the 2026-10-18
    # review are counted against a baseline that may only fall. The count is 0
    # today (the 14 review findings and the two high findings of the snapshot
    # audit are fixed) — the gate says so, and any new open critical/high
    # finding turns it red.
    name: Ratchet gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The action installs the released binary and verifies its SHA-256
      # against the checksums of the release. It is pinned to a commit SHA:
      # this repository's supply-chain contract allows no moving tag.
      # The SHA is the v0.5.1 release commit.
      # Dependabot bumps the pin.
      - uses: all-the-rest/ratchet-cli@4cace52ac7731985130292ead6ae81d44b4d72d6
        with:
          mode: validate

  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: portal_test_db
          POSTGRES_USER: portal_user
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd="pg_isready -U portal_user -d portal_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      meilisearch:
        image: getmeili/meilisearch:v1.48.3
        ports:
          - 7701:7700
        env:
          MEILI_MASTER_KEY: test_meili_secret
          MEILI_ENV: development
      mailpit:
        # phpunit.xml sendet via SMTP auf 127.0.0.1:1025; MailpitAssertions.php
        # liest Mails ueber die HTTP-API auf 127.0.0.1:8025 (hardcodiert).
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Wait for Meilisearch
        # PHPUnit includes live Scout coverage. A started service container is
        # not necessarily ready to accept the first index request.
        working-directory: ${{ github.workspace }}
        env:
          MEILISEARCH_HEALTH_URL: http://127.0.0.1:7701/health
          MEILISEARCH_READY_TIMEOUT_SECONDS: "60"
          MEILISEARCH_REQUEST_TIMEOUT_SECONDS: "2"
          MEILISEARCH_READY_POLL_SECONDS: "1"
        run: bash scripts/wait-for-meilisearch.sh
      # PHP-Tests laufen im tag-gepinnten Prod-Image portal-base (PHP 8.5 +
      # exiftool + alle App-Extensions) - identisch zur Prod-Runtime. Composer
      # kommt wie in Prod aus einem tag-gepinnten offiziellen Image. Die
      # CI-Env (PostgreSQL/Meili/Mail/JWT/Admin) steht in backend/.env.ci und
      # wird als `.env` eingespielt. `--network host` -> Dienste bleiben unter
      # 127.0.0.1:5432/7701/1025 erreichbar.
      - name: Start PHP container (prod image)
        run: |
          # The pinned prod image runs as `USER www-data` (uid 1000), but the
          # workspace is a bind mount owned by the runner user, so composer,
          # `artisan key:generate`, storage/logs and .env are not writable and
          # the job dies before PHPUnit starts. Run the test container as root;
          # the non-root guarantee that matters is enforced for the deployed
          # artifact via deployment/Dockerfile, compose `user:` and
          # tests/infrastructure/verify-image-nonroot.sh, none of which this
          # overrides. Same rationale as the e2e job's `options: --user root`.
          docker run -d --name php \
            --user root \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            ghcr.io/reisinger-pictures/portal-base:8.5 \
            sleep infinity
          until docker exec php php -v > /dev/null 2>&1; do sleep 1; done
      - name: Install PostgreSQL PDO driver
        # This is redundant once portal-base is rebuilt from deployment/Dockerfile
        # with pdo_pgsql included; the pinned image does not have that driver yet.
        run: docker exec php sh -c 'apt-get update && apt-get install -y libpq-dev && docker-php-ext-install pdo_pgsql'
      - name: Prepare environment
        run: cp .env.ci .env
      - name: Install dependencies
        # Prod-Nutzung: `composer install --ignore-platform-reqs` (tag-gepinnt)
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            composer:2.10.3 install --ignore-platform-reqs --no-interaction --optimize-autoloader
      - name: Generate app key
        run: docker exec php php artisan key:generate
      - name: Wait for PostgreSQL
        # Use the same PDO driver, host, database and credentials as the test
        # environment. Bound retries so an unavailable service fails clearly.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: portal_test_db
          DB_USERNAME: portal_user
          DB_PASSWORD: admin
        run: |
          docker exec \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_DATABASE \
            -e DB_USERNAME \
            -e DB_PASSWORD \
            php \
            php -r '
          $dsn = "pgsql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE");
          $deadline = time() + 120;
          $last = "no attempt";
          do {
              try {
                  new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
                  echo "PostgreSQL is reachable on ".getenv("DB_HOST").":".getenv("DB_PORT")."\n";
                  exit(0);
              } catch (Throwable $e) {
                  $last = $e->getMessage();
                  sleep(1);
              }
          } while (time() < $deadline);
          fwrite(STDERR, "PostgreSQL did not accept connections: ".$last."\n");
          exit(1);
          '
      - name: Backend Pint and PHPUnit gate
        # Pint runs in --test mode, so it reports and never rewrites. This is a
        # gate, not a formatter: it fails the build on style, so formatting
        # cannot silently drift back in across a large changeset. The codebase
        # was normalised once (165 files) when the gate was added, so this
        # starts from a clean baseline. Locally: cd backend && ./vendor/bin/pint,
        # then commit the result.
        run: sh ../scripts/gates.sh full backend
      - name: Backend Test-Summary
        if: always()
        run: |
          CLEAN=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/phpunit.log 2>/dev/null || true)
          # Parse results: "Tests: 42, Assertions: 120, Errors: 1, Failures: 2"
          # or "OK (42 tests, 120 assertions)"
          SUMMARY=$(grep -E '^Tests:|OK \(' <<< "$CLEAN" | tail -n 1)
          TESTS=$(echo "$SUMMARY" | sed -n 's/.*Tests: \([0-9]*\).*/\1/p; s/.*OK (\([0-9]*\) tests.*/\1/p')
          ASSERTIONS=$(echo "$SUMMARY" | sed -n 's/.*Assertions: \([0-9]*\).*/\1/p; s/.*OK ([0-9]* tests, \([0-9]*\) assertions.*/\1/p')
          ERRORS=$(echo "$SUMMARY" | sed -n 's/.*Errors: \([0-9]*\).*/\1/p')
          FAILURES=$(echo "$SUMMARY" | sed -n 's/.*Failures: \([0-9]*\).*/\1/p')
          TESTS=${TESTS:-0}
          ASSERTIONS=${ASSERTIONS:-0}
          ERRORS=${ERRORS:-0}
          FAILURES=${FAILURES:-0}
          TOTAL=$((ERRORS + FAILURES))
          if [ "$TOTAL" -eq 0 ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="PASS"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="FAIL"
          fi
          {
            echo "## Backend (PHPUnit)"
            echo ""
            echo "| Metrik | Wert |"
            echo "|---|---|"
            echo "| Status | $STATUS_ICON $STATUS_TEXT |"
            echo "| Tests | $TESTS total |"
            echo "| Assertions | $ASSERTIONS total |"
            if [ "$ERRORS" -gt 0 ]; then
              echo "| Errors | ❌ $ERRORS |"
            fi
            if [ "$FAILURES" -gt 0 ]; then
              echo "| Failures | ❌ $FAILURES |"
            fi
            FAILED=$(grep -E '^\s*[0-9]+\) ' <<< "$CLEAN" | tail -n 10)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "<details><summary>Failed tests</summary>"
              echo ""
              echo '```text'
              echo "$FAILED"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  backend-postgres:
    # These driver-gated contracts require a real PostgreSQL service. This
    # additive job runs only those classes against a throwaway database, and a
    # skipped test is a red job so the database-specific proof cannot silently
    # disappear. The aggregate already waits for the E2E matrix, so this adds no
    # latency to the CI gate.
    name: Backend (PostgreSQL contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: portal_test_db
      DB_USERNAME: portal_user
      DB_PASSWORD: admin
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: portal_test_db
          POSTGRES_USER: portal_user
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd="pg_isready -U portal_user -d portal_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start PHP container (prod image)
        # The pinned portal-base:8.5 image uses the host network, so the
        # PostgreSQL service is reachable at 127.0.0.1:5432.
        run: |
          docker run -d --name php-postgres \
            --user root \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            ghcr.io/reisinger-pictures/portal-base:8.5 \
            sleep infinity
          until docker exec php-postgres php -v > /dev/null 2>&1; do sleep 1; done
      - name: Install PostgreSQL PDO driver
        # This is redundant once portal-base is rebuilt from deployment/Dockerfile
        # with pdo_pgsql included; the pinned image does not have that driver yet.
        run: docker exec php-postgres sh -c 'apt-get update && apt-get install -y libpq-dev && docker-php-ext-install pdo_pgsql'
      - name: Prepare environment
        run: cp .env.ci .env
      - name: Install dependencies
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            composer:2.10.3 install --ignore-platform-reqs --no-interaction --optimize-autoloader
      - name: Generate app key
        run: docker exec php-postgres php artisan key:generate
      - name: Wait for PostgreSQL
        # The wait is bounded (120 seconds) and tests the same PDO connection
        # coordinates the migration and test run use.
        run: |
          docker exec \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_DATABASE \
            -e DB_USERNAME \
            -e DB_PASSWORD \
            php-postgres \
            php -r '
          $dsn = "pgsql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE");
          $deadline = time() + 120;
          $last = "no attempt";
          do {
              try {
                  new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
                  echo "PostgreSQL is reachable on ".getenv("DB_HOST").":".getenv("DB_PORT")."\n";
                  exit(0);
              } catch (Throwable $e) {
                  $last = $e->getMessage();
                  sleep(1);
              }
          } while (time() < $deadline);
          fwrite(STDERR, "PostgreSQL did not accept connections: ".$last."\n");
          exit(1);
          '
      - name: Verify pcntl_fork is available
        # The race test skips itself without pcntl_fork. A skipped test in a
        # green job is exactly the failure mode this job exists to remove, so
        # the extension is checked before the run: a missing pcntl_fork must
        # fail the job instead of silently downgrading the proof.
        run: |
          docker exec php-postgres php -r 'if (! function_exists("pcntl_fork")) { fwrite(STDERR, "ext-pcntl is missing in the CI PHP image\n"); exit(1); } echo "pcntl_fork available\n";'
      - name: Migrate and run PostgreSQL contract tests
        run: sh ../scripts/gates.sh full postgres
      - name: Backend (PostgreSQL) Test-Summary
        # A green job that skipped the proof is not a proof: any skipped test
        # turns this job red instead of silently removing PostgreSQL coverage.
        if: always()
        run: |
          if [ ! -f /tmp/phpunit-postgres.log ]; then
            echo "::error::The PostgreSQL test step produced no output - the run did not complete."
            exit 1
          fi
          CLEAN=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/phpunit-postgres.log 2>/dev/null || true)
          SUMMARY=$(grep -E '^[[:space:]]*Tests:|OK \(' <<< "$CLEAN" | tail -n 1 || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::The PostgreSQL run produced no PHPUnit summary line."
            exit 1
          fi
          echo "PostgreSQL PHPUnit summary: ${SUMMARY}"
          if grep -qi 'skipped' <<< "$CLEAN"; then
            echo "::error::A PostgreSQL contract test was skipped in the run."
            exit 1
          fi
          {
            echo "## Backend (PostgreSQL contracts)"
            echo ""
            echo "| Metrik | Wert |"
            echo "|---|---|"
            echo "| Treiber | PostgreSQL 16 |"
            echo "| Klassen | ContractSignerIdentityRaceTest, ContractSignerIdentityTest, ContractContentHeartbeatPostgresTest, GuestOrderMigrationContractTest, PayoutNaturalKeyTest |"
            echo "| Ergebnis | ✅ PASS |"
            echo "| Summary | $SUMMARY |"
          } >> "$GITHUB_STEP_SUMMARY"

  cutover-copy:
    # The one-time cutover (D-63) is a host script plus an artisan command, and
    # the command is the part that can be tested without the host: migrate a
    # throwaway MariaDB, copy it into a throwaway PostgreSQL, and let the
    # verifier decide. Without this job the copy path is only exercised on the
    # day it matters, against production data, by an operator.
    name: Cutover copy (MariaDB -> PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Source coordinates of the throwaway MariaDB. The target coordinates are
    # passed to the command explicitly, because both connections read the same
    # DB_USERNAME/DB_PASSWORD and the pgsql default port would otherwise be
    # taken from this env block.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_DATABASE: portal_test_db
      DB_USERNAME: portal_user
      DB_PASSWORD: admin
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_test_db
          MYSQL_USER: portal_user
          MYSQL_PASSWORD: admin
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: portal_test_db
          POSTGRES_USER: portal_user
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd="pg_isready -U portal_user -d portal_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start PHP container (prod image)
        run: |
          docker run -d --name php-cutover \
            --user root \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            ghcr.io/reisinger-pictures/portal-base:8.5 \
            sleep infinity
          until docker exec php-cutover php -v > /dev/null 2>&1; do sleep 1; done
      - name: Install PostgreSQL PDO driver
        # Redundant once portal-base is rebuilt from deployment/Dockerfile with
        # pdo_pgsql included. pdo_mysql is already in the pinned image and is
        # what the source side of the copy needs.
        run: docker exec php-cutover sh -c 'apt-get update && apt-get install -y libpq-dev && docker-php-ext-install pdo_pgsql'
      - name: Prepare environment
        run: cp .env.ci .env
      - name: Install dependencies
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            composer:2.10.3 install --ignore-platform-reqs --no-interaction --optimize-autoloader
      - name: Generate app key
        run: docker exec php-cutover php artisan key:generate
      - name: Wait for MariaDB and PostgreSQL
        # Bounded wait on the exact PDO coordinates the copy uses; a started
        # service container is not necessarily ready for the first connection.
        run: |
          docker exec \
            -e DB_HOST -e DB_PORT -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD \
            php-cutover \
            php -r '
          $deadline = time() + 120;
          foreach (["mysql" => "MariaDB", "pgsql" => "PostgreSQL"] as $driver => $label) {
              $port = $driver === "mysql" ? getenv("DB_PORT") : "5432";
              $dsn = $driver.":host=".getenv("DB_HOST").";port=".$port.";dbname=".getenv("DB_DATABASE");
              $last = "no attempt";
              while (time() < $deadline) {
                  try {
                      new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
                      echo $label." is reachable on ".getenv("DB_HOST").":".$port."\n";
                      continue 2;
                  } catch (Throwable $e) {
                      $last = $e->getMessage();
                      sleep(1);
                  }
              }
              fwrite(STDERR, $label." did not accept connections: ".$last."\n");
              exit(1);
          }
          '
      - name: Build the source schema and seed it
        # The copy moves rows; the schema on both sides comes from the same
        # migrations. Seeding gives the verifier real rows to compare (settings,
        # roles, the bootstrap admin) instead of an empty database that would
        # make every count trivially equal. `docker exec` does not inherit the
        # job env, so the MariaDB coordinates are passed explicitly — .env holds
        # the PostgreSQL defaults.
        run: |
          docker exec -e DB_CONNECTION=mariadb -e DB_HOST=127.0.0.1 -e DB_PORT=3307 \
            php-cutover php artisan migrate --force
          docker exec -e DB_CONNECTION=mariadb -e DB_HOST=127.0.0.1 -e DB_PORT=3307 \
            php-cutover php artisan db:seed --force
      - name: Migrate the PostgreSQL target and copy
        run: |
          docker exec \
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            php-cutover php artisan migrate --force
          docker exec php-cutover php artisan portal:db-copy \
            --source=mariadb --target=pgsql \
            --source-port=3307 --target-port=5432
      - name: Verify the copy
        run: |
          docker exec php-cutover php artisan portal:db-copy \
            --source=mariadb --target=pgsql \
            --source-port=3307 --target-port=5432 \
            --verify-only
      - name: The verifier fails closed on a mismatch
        # A verifier that only ever prints PASS proves nothing. One row is
        # removed from the target and the same verify command must exit non-zero
        # and name the table.
        run: |
          docker exec php-cutover php -r '
          $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=portal_test_db", "portal_user", "admin");
          $pdo->exec("DELETE FROM settings WHERE ctid IN (SELECT ctid FROM settings LIMIT 1)");
          echo "removed one row from settings on the target\n";
          '
          set +e
          output=$(docker exec php-cutover php artisan portal:db-copy \
            --source=mariadb --target=pgsql \
            --source-port=3307 --target-port=5432 \
            --verify-only 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::The verifier accepted a target with a missing row."
            exit 1
          fi
          if ! grep -Fq 'Row count mismatch for settings:' <<< "$output"; then
            echo "::error::The verifier failed, but did not report the missing settings row."
            exit 1
          fi
          echo "Verifier rejected the mismatch with exit code $status"

  frontend:
    name: Frontend (Lint, Build, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          check-latest: false
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify Node runtime
        run: test "$(node --version)" = "v26.7.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: sh ../scripts/gates.sh full frontend
        env:
          # Public build configuration only; never expose TURNSTILE_SECRET here.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_BUILD_REQUIRED: ${{ vars.TURNSTILE_BUILD_REQUIRED || 'false' }}

  e2e:
    # 3 Projekt-Shards je (Desktop / Mobile; 1/3 und 3/3 mit --workers=2,
    # der client/checkout-lastige 2/3 mit --workers=1) + 1 dedizierter,
    # strikt serieller Matrix-Eintrag (--workers=1). Seriell laufen:
    #  * Board-Suites: teilen sich bekannte Board-/Settings-Zustände; unter
    #    voller Parallelität kollidieren Drag&Drop/Status-Select und
    #    Settings-Roundtrips. project-clear-fields und brand-settings verwenden
    #    ebenfalls serialen Testmodus.
    #  * billing-details.spec.ts: schreibt globale (brand-weite) Bankdaten-Settings
    #    in /api/management/settings/billing-details. Desktop- UND Mobile-Shard
    #    führen dieselben Tests parallel gegen dieselbe DB -> gegenzeitige
    #    Überschreibung (nach Reload steht ein anderer Inhaber/IBAN da; die
    #    IBAN-Validierung sieht fremde Daten). Im Serial-Shard (workers=1) gibt es
    #    keinen parallelen Schreiber.
    # --project grenzt die Shards an Projektgrenzen ab (--shard splittet Dateien
    # global über BEIDE Projekte und ist dafür ungeeignet). Die fünf unten
    # ausgewählten Specs werden im Serial-Shard isoliert.
    name: E2E (Playwright) — ${{ matrix.name }}
    # Job-level `if` darf KEINEN secrets-Context lesen (offizielle Context
    # availability: jobs.<job_id>.if -> github, needs, vars, inputs). Secrets
    # fuer Dependabot-ausgeloeste Runs kommen aus dem **Dependabot**-Secret-Store,
    # nicht aus den Actions-Secrets — das gilt fuer `push` UND `pull_request`;
    # `pull_request_target` faellt heraus — und dort auch nur, wenn der Base-Ref
    # des PRs von Dependabot stammt; bei einem Dependabot-PR gegen main greift
    # das nicht (`automerge.yml` mergt dort mit `secrets.GITHUB_TOKEN`). Der
    # PR-seitige Lauf wird deshalb nicht wegen fehlender Secrets uebersprungen,
    # sondern bewusst: die
    # siebenteilige E2E-Matrix soll pro Dependabot-PR einmal statt zweimal laufen
    # (Owner-Entscheidung 2026-10-18). Autoritativ ist der Push-Lauf auf dem
    # Dependabot-Branch (dort greifen die Dependabot-Secrets) — `automerge.yml`
    # wartet exakt auf `CI gate (push)`. Fork-PRs bleiben ebenfalls uebersprungen,
    # normale Same-Repo-PRs laufen. Der eigentliche Missing-Secret-Check bleibt im
    # ersten Step unten.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    # Gesamter E2E-Job laeuft im Test-Image portal-e2e (portal-base + Node/
    # pnpm/Composer + Playwright-Chromium vorinstalliert) -> kein Browser-
    # Download und kein apt-Deps-Setup pro Run. Backend & Vite laufen als
    # Hintergrundprozesse im selben Container; die Daten-Dienste (postgres/
    # meili/mailpit) sind per Service-Name erreichbar. Details: features/
    # infrastructure/28-ci-test-image.md.
    container:
      # Concrete tag, never `latest` (P1-M45). e2e-image.yml publishes
      # portal-e2e:<playwright-version> (1.64.1 today, derived from the
      # RESOLVED version in frontend/pnpm-lock.yaml) plus `latest`; this
      # consumer follows the version tag. verify-image-freshness.sh fails once
      # that artifact is older than 14 days, so a workflow that silently
      # stopped rebuilding is detected; the pin itself is checked against the
      # lockfile by verify-playwright-version.sh.
      image: ghcr.io/reisinger-pictures/portal-e2e:1.64.1
      # INFRA-2: the runner mounts the host workspace at $GITHUB_WORKSPACE and
      # runs steps inside this container. Dockerfile.e2e ends in
      # `USER www-data` (uid 1000), so without this override actions/checkout,
      # pnpm install, composer install and `artisan key:generate` would write as
      # uid 1000 into a workspace owned by the host runner user -> EACCES and a
      # red job. CI is ephemeral, so running the job as root here is safe and
      # intentional. The non-root runtime guarantee belongs to the *production*
      # artifacts: deployment/Dockerfile's `USER www-data` plus the compose
      # `user: "1002:82"` on backend, sftpgo, composer_init and the ftp-events
      # sidecar (AGENTS.md D-1) — all of them
      # asserted by InfrastructureSupplyChainPolicyTest, the only place that
      # inspects compose `user:` values. The image side (published Config.User
      # vs. the Dockerfile `USER`) is verified separately by
      # tests/infrastructure/verify-image-nonroot.sh, which reads the compose
      # file only to pin image tags. Never drop this option
      # without also making the mounted workspace writable by uid 1000.
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop/Mobile je in 3 Sub-Shards geteilt (`--shard=x/3`) plus
          # ein dedizierter serieller Matrix-Eintrag für die isolierten
          # Board-/Settings-Suites. Die gewählten Worker-Zahlen und der
          # 2/3-Eintrag sind eine
          # Abbauentscheidung für die aktuelle Suite; historische Timing-Werte
          # sind keine Garantie. Die 120s/Test- und 1500s/Global-Budgets
          # bleiben getrennte, begrenzte Limits, damit echte Hänger weiterhin
          # fehlschlagen.
          # Playwright shardet nach Datei-Reihenfolge, nicht Laufzeit -> nach
          # einem Lauf die Entry-Dauern messen und nur bei aktuellem Bedarf
          # anhand stabiler Gruppen nachbalancieren.
          - {name: 'Desktop (1/3)', slug: 'desktop-1', args: '--project="Desktop Chrome" --grep-invert "projects-board|production-board|project-clear-fields|brand-settings|billing-details" --workers=2 --shard=1/3'}
          - {name: 'Desktop (2/3)', slug: 'desktop-2', args: '--project="Desktop Chrome" --grep-invert "projects-board|production-board|project-clear-fields|brand-settings|billing-details" --workers=1 --shard=2/3'}
          - {name: 'Desktop (3/3)', slug: 'desktop-3', args: '--project="Desktop Chrome" --grep-invert "projects-board|production-board|project-clear-fields|brand-settings|billing-details" --workers=2 --shard=3/3'}
          - {name: 'Mobile (1/3)', slug: 'mobile-1', args: '--project="Mobile Chrome" --grep-invert "projects-board|production-board|project-clear-fields|brand-settings|billing-details" --workers=2 --shard=1/3'}
          - {name: 'Mobile (2/3)', slug: 'mobile-2', args: '--project="Mobile Chrome" --grep-invert "projects-board|production-board|project-clear-fields|brand-settings|billing-details" --workers=1 --shard=2/3'}
          - {name: 'Mobile (3/3)', slug: 'mobile-3', args: '--project="Mobile Chrome" --grep-invert "projects-board|production-board|project-clear-fields|brand-settings|billing-details" --workers=2 --shard=3/3'}
          - {name: 'serial (isolated suites)', slug: 'kanban', args: '--grep "projects-board|production-board|project-clear-fields|brand-settings|billing-details" --workers=1'}
    env:
      # Zuordnung spiegelt backend/.env (lokales, funktionierendes E2E-Setup):
      # STRIPE_KEY = pk_test (publishable), STRIPE_SECRET = sk_test (secret key).
      # StripePaymentService nutzt config('services.stripe.secret') als API-Key.
      STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
      STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      JWT_SECRET: 2d093d84542d70f133a1689afb5866bed31edd1b520ce8c02ea9d25559fb0834
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      # Offizielle Cloudflare-Dummy-Keys (immer erfolgreich) fuer den
      # Risk-Triggered-Turnstile-E2E-Test. Die User-Schwelle bleibt bei 3;
      # IP-Schwelle hoch, weil alle E2E-Worker dieselbe Runner-IP nutzen.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      TURNSTILE_ALLOWED_HOSTNAMES: localhost,example.com
      TURNSTILE_USER_THRESHOLD_PER_HOUR: 3
      TURNSTILE_IP_THRESHOLD_PER_HOUR: 1000
      # Isolated E2E buyers are created immediately before checkout; disable
      # the production new-account delay so the risk threshold is what triggers.
      STRIPE_CHECKOUT_NEW_ACCOUNT_HOURS: 0
      # Mailpit-API fuer die E2E-Helper (MailpitHelper.ts liest MAILPIT_API_URL;
      # Default waere localhost:8025). Container-Modus: Dienste sind nur per
      # Service-Name erreichbar, nicht via 127.0.0.1.
      MAILPIT_API_URL: http://mailpit:8025/api/v1
      # D-36: das gemeinsame Secret des internen Upload-Event-Endpunkts
      # (`config('ftp.events.secret')`, Header-Name ist die Konstante
      # `X-FTP-Event-Secret`). Ein Dummy, aber nicht optional: ohne es antwortet
      # `/api/internal/ftp/upload-event` fail-closed mit 401, und
      # `frontend/tests/e2e/photographer/ftp-import-event.spec.ts` koennte den
      # Event-Pfad nicht ausloesen. Der Wert steht im Job-Env, damit Backend und
      # Spec dieselbe Variable lesen; Laravels immutable Dotenv laesst das
      # Prozess-Env gegenueber `.env` gewinnen, `.env.ci` bleibt unveraendert.
      FTP_EVENT_SECRET: e2e-local-dummy-event-secret-2026
      # Derselbe absolute Posteingangs-Wurzelpfad, den der Step "Prepare backend
      # environment" per sed in `.env` schreibt (relativ wuerde
      # `App\Support\FtpInboxDirectory::root()` werfen). Hier zusaetzlich im
      # Job-Env, damit der Test-Prozess ihn ohne eigene Kopie liest; der Wert
      # ist identisch, also aendert die Vorrangregel nichts am Backend.
      FTP_STORAGE_PATH: /tmp/portal-e2e-ftp
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: portal_test_db
          POSTGRES_USER: portal_user
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd="pg_isready -U portal_user -d portal_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      meilisearch:
        image: getmeili/meilisearch:v1.48.3
        ports:
          - 7701:7700
        env:
          MEILI_MASTER_KEY: test_meili_secret
          MEILI_ENV: development
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 8025:8025
          - 1025:1025
      # Real SFTPGo Admin API for the camera-account provisioning path that the
      # profile slug-change specs exercise. A slug change is fail-closed without
      # it, so a reachable service is the honest environment for those specs —
      # not a relaxed assertion. Only the admin API is needed; the portal never
      # speaks FTP itself, so no FTPS/SFTP bindings are configured here.
      sftpgo:
        image: drakkan/sftpgo:2.7.x
        env:
          # Both halves are required: the *_DEFAULT_ADMIN_* pair is ignored
          # while `data_provider.create_default_admin` stays at its false
          # default, and /api/v2/token would answer 401.
          SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
          SFTPGO_DEFAULT_ADMIN_USERNAME: e2e
          SFTPGO_DEFAULT_ADMIN_PASSWORD: e2e-sftpgo-admin-2026
          SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
          SFTPGO_HTTPD__BINDINGS__0__ADDRESS: "0.0.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install PostgreSQL PDO driver
        # This is redundant once portal-base is rebuilt from deployment/Dockerfile
        # with pdo_pgsql included; the pinned e2e image does not have it yet.
        run: apt-get update && apt-get install -y libpq-dev && docker-php-ext-install pdo_pgsql
      - name: Wait for Meilisearch
        # GitHub service containers are started before the job, but their
        # readiness is not guaranteed. Keep Scout setup behind the same bounded
        # health contract as the local Compose harness.
        env:
          MEILISEARCH_HEALTH_URL: http://meilisearch:7700/health
          MEILISEARCH_READY_TIMEOUT_SECONDS: "60"
          MEILISEARCH_REQUEST_TIMEOUT_SECONDS: "2"
          MEILISEARCH_READY_POLL_SECONDS: "1"
        run: bash scripts/wait-for-meilisearch.sh
      - name: Wait for SFTPGo
        # Service containers start before the job but are not guaranteed ready.
        # The patience is bounded so a broken service fails here with a clear
        # name instead of surfacing as a provisioning 503 much later.
        run: |
          timeout 60s bash -c 'until curl -sf http://sftpgo:8080/healthz > /dev/null; do sleep 1; done'
      - name: Ensure Stripe test keys are configured
        # Fail closed on all three Stripe test secrets the job injects
        # (job env above). The booleans carry presence only, so no secret
        # value can reach the log. A missing STRIPE_KEY (publishable) or
        # STRIPE_WEBHOOK_SECRET used to pass this preflight and fail later
        # without a cause: the publishable key feeds the Vite build (the
        # VITE_STRIPE_PUBLIC_KEY secret falls back to STRIPE_KEY), the
        # webhook secret feeds the Stripe self-test, and only the secret key
        # was used by the balance probe that follows.
        env:
          STRIPE_SECRET_SET: ${{ secrets.STRIPE_SECRET != '' }}
          STRIPE_KEY_SET: ${{ secrets.STRIPE_KEY != '' }}
          STRIPE_WEBHOOK_SECRET_SET: ${{ secrets.STRIPE_WEBHOOK_SECRET != '' }}
        run: |
          if [ "$STRIPE_SECRET_SET" != "true" ] || [ "$STRIPE_KEY_SET" != "true" ] || [ "$STRIPE_WEBHOOK_SECRET_SET" != "true" ]; then
            echo "::error::STRIPE_SECRET (sk_test) / STRIPE_KEY (pk_test) / STRIPE_WEBHOOK_SECRET Secrets sind nicht konfiguriert - E2E kann nicht laufen."
            exit 1
          fi
      - name: Validate Stripe API key (read + write)
        env:
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          # Eindeutiger Idempotency-Key pro Matrix-Eintrag: alle sieben
          # E2E-Einträge desselben Runs teilen sich GITHUB_RUN_ID -> parallele
          # Requests mit identischem Key -> Stripe 409 (idempotency_key_in_use).
          IDEMPOTENCY_KEY: pi_ci_validate_${GITHUB_RUN_ID}_${{ matrix.slug }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/stripe-balance.json -w '%{http_code}' \
            -H "Authorization: Bearer ${STRIPE_SECRET}" \
            https://api.stripe.com/v1/balance)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Stripe balance (read) ${HTTP_CODE}: $(cat /tmp/stripe-balance.json)"
            exit 1
          fi
          echo "Stripe read (balance) OK"
          HTTP_CODE=$(curl -sS -o /tmp/stripe-pi.json -w '%{http_code}' \
            -H "Authorization: Bearer ${STRIPE_SECRET}" \
            -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
            https://api.stripe.com/v1/payment_intents \
            -d "amount=150000" -d "currency=eur" \
            -d "receipt_email=e2e-ci-validate@example.com" \
            -d "metadata[order_id]=ci_validate")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Stripe payment_intents create (write) ${HTTP_CODE}: $(cat /tmp/stripe-pi.json)"
            exit 1
          fi
          echo "Stripe write (payment_intents create) OK"
      # Der komplette Job laeuft im tag-gepinnten Test-Image
      # ghcr.io/reisinger-pictures/portal-e2e (portal-base + Node/pnpm/Composer +
      # Playwright-Chromium vorinstalliert) ->
      # kein Browser-Download, kein apt-Deps-Setup pro Run. App-Code wird vom
      # Runner gemountet; Dependencies werden pro Commit frisch installiert
      # (Invariante: nie node_modules/vendor einbacken).
      # Container-Modus: Daten-Dienste sind per Service-Name erreichbar
      # (nicht via 127.0.0.1) -> .env-Overrides unten; `.env.ci` selbst bleibt
      # fuer den Backend-/PHPUnit-Job unveraendert.
      - name: Prepare backend environment
        working-directory: backend
        run: |
          cp .env.ci .env
          sed -i.bak -E \
            -e 's|^DB_HOST=.*|DB_HOST=postgres|' \
            -e 's|^DB_PORT=.*|DB_PORT=5432|' \
            -e 's|^MEILISEARCH_HOST=.*|MEILISEARCH_HOST=http://meilisearch:7700|' \
            -e 's|^MAIL_HOST=.*|MAIL_HOST=mailpit|' \
            -e 's|^FTP_STORAGE_PATH=.*|FTP_STORAGE_PATH=/tmp/portal-e2e-ftp|' \
            .env && rm -f .env.bak
          # SFTPGo Admin API for the camera-account provisioning path. Appended
          # because .env.ci does not carry these keys; the service hostname is
          # the GitHub Service label above. No API key: the JWT fallback is the
          # path under test, matching the local e2e-up.sh setup.
          {
            echo 'SFTPGO_BASE_URL=http://sftpgo:8080'
            echo 'SFTPGO_API_KEY='
            echo 'SFTPGO_ADMIN_USERNAME=e2e'
            echo 'SFTPGO_ADMIN_PASSWORD=e2e-sftpgo-admin-2026'
          } >> .env
          grep -q '^DB_HOST=postgres$' .env
          grep -q '^DB_PORT=5432$' .env
          grep -q '^MEILISEARCH_HOST=http://meilisearch:7700$' .env
          grep -q '^MAIL_HOST=mailpit$' .env
          grep -q '^FTP_STORAGE_PATH=/tmp/portal-e2e-ftp$' .env
          grep -q '^SFTPGO_BASE_URL=http://sftpgo:8080$' .env
          grep -q '^SFTPGO_ADMIN_USERNAME=e2e$' .env
      - name: Install backend dependencies
        working-directory: backend
        # Composer ist im Image (tag-gepinntes COPY --from); kein separater
        # composer:-Container mehr noetig.
        run: composer install --ignore-platform-reqs --no-interaction --optimize-autoloader
      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate
      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force
      - name: Seed database
        working-directory: backend
        # Full Seed: erzeugt den von den E2E-Specs erwarteten
        # admin@example.com mit allen Rollen + Katalog. Der Basiseeder bleibt
        # netzwerkfrei; deterministische Location-Fixtures folgen explizit.
        run: php artisan db:seed --force
      - name: Seed E2E location fixtures
        working-directory: backend
        # Bewusst ein eigener, expliziter E2E-Schritt: keine GeoNames-Downloads
        # im Basiseeder und kein Import im Produktions-Start. Der Index wird vor
        # dem Location-Import geleert und anschließend mit den Projekt-Settings
        # neu aufgebaut, damit die frische E2E-Datenbank reproduzierbar ist.
        run: |
          php artisan db:seed --class=E2ELocationSeeder --force
          php artisan scout:flush 'App\Models\Location'
          php artisan scout:sync-index-settings
          php artisan scout:import 'App\Models\Location'
      - name: Start backend server
        working-directory: backend
        env:
          CI: "1"
        # WICHTIG: `--no-reload` NICHT entfernen! Laravels ServeCommand filtert
        # sonst alle Env-Vars heraus, die nicht in `$passthroughVariables`
        # stehen (APP_ENV, PATH, XDEBUG, ...). STRIPE_SECRET kommt aus den
        # Job-Secrets (immutable Dotenv -> gewinnt gegen den .env-Platzhalter),
        # fehlt aber in der ServeCommand-Passliste -> ohne --no-reload Stripe 401.
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/php-serve.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://127.0.0.1:8000/api/ping > /dev/null; do sleep 1; done'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          check-latest: false
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify Node runtime
        working-directory: frontend
        run: test "$(node --version)" = "v26.7.0"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright browsers (fallback install)
        working-directory: frontend
        # Browser sind im Image unter /ms-playwright vorinstalliert (Version ==
        # @playwright/test). Dieser Schritt ist ein No-Op, wenn die Version
        # passt; bei Versionsdrift (Dependabot-Bump vor Image-Rebuild) laedt er
        # nur die fehlende Browser-Version nach. `--with-deps` bewusst NICHT:
        # apt-System-Deps sind im Image gebacken.
        run: npx playwright install chromium
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://localhost:4321/ > /dev/null; do sleep 1; done'
        env:
          VITE_API_PROXY: http://127.0.0.1:8000
          # Publik-Key = VITE_STRIPE_PUBLIC_KEY, sonst Fallback auf STRIPE_KEY
          # (pk_test - Zuordnung entspricht backend/.env, siehe oben)
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY || secrets.STRIPE_KEY }}
          # Matched with the official always-pass backend dummy key above.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - name: Run E2E tests
        working-directory: frontend
        # SECURITY: use only the list reporter. Playwright HTML reports,
        # test-results, traces, screenshots, and videos may contain cookies or
        # test data and are never uploaded by this workflow. The step summary
        # below is the intentionally sanitized CI output.
        run: |
          set -o pipefail
          sh ../scripts/gates.sh full e2e ${{ matrix.args }}
        env:
          CI: "1"
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin
      - name: E2E Test-Summary
        if: always()
        run: |
          PASSED=$(grep -oP '^\s*\K\d+(?= passed)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          FAILED=$(grep -oP '^\s*\K\d+(?= failed)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          FLAKY=$(grep -oP '^\s*\K\d+(?= flaky)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          SKIPPED=$(grep -oP '^\s*\K\d+(?= did not run)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          FLAKY=${FLAKY:-0}
          SKIPPED=${SKIPPED:-0}
          TOTAL=$((PASSED + FAILED))
          if [ "$FAILED" -eq 0 ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="PASS"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="FAIL"
          fi
          {
            echo "## E2E (Playwright)"
            echo ""
            echo "| Metrik | Wert |"
            echo "|---|---|"
            echo "| Status | $STATUS_ICON $STATUS_TEXT |"
            echo "| Passed | ✅ $PASSED |"
            if [ "$FAILED" -gt 0 ]; then
              echo "| Failed | ❌ $FAILED |"
            fi
            if [ "$FLAKY" -gt 0 ]; then
              echo "| Flaky | ⚠️ $FLAKY |"
            fi
            if [ "$SKIPPED" -gt 0 ]; then
              echo "| Skipped | ⏭️ $SKIPPED |"
            fi
            echo "| Total | $TOTAL |"
            FAILED_TESTS=$(grep -E '^\s*[0-9]+\) \[' /tmp/e2e.log 2>/dev/null | tail -n 10)
            if [ -n "$FAILED_TESTS" ]; then
              echo ""
              echo "<details><summary>Failed tests</summary>"
              echo ""
              echo '```text'
              echo "$FAILED_TESTS"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # SECURITY: No Playwright artifacts are uploaded. Reports and test-results
      # can contain browser storage, cookies, screenshots, or request data.

  ci-gate:
    # The event suffix is part of the check-run identity. Dependabot creates
    # both a push run and a pull_request run for the same head SHA; distinct
    # names keep the PR aggregate usable without making the push aggregate
    # wait on (or be poisoned by) the PR-side jobs.
    name: CI gate (${{ github.event_name }})
    # Keep the fail-closed always() gate for push and normal PRs. The
    # Dependabot pull_request aggregate is intentionally skipped together with
    # its E2E job — not because that run lacks secrets (a Dependabot
    # pull_request run reads the Dependabot secret store, exactly like its push
    # run; only pull_request_target is excluded, and only when the PR base ref
    # was created by Dependabot — not the case for a Dependabot PR against main,
    # which is why automerge.yml merges with secrets.GITHUB_TOKEN), but to run
    # the seven-part
    # E2E matrix once per Dependabot PR instead of twice (Owner-Entscheidung
    # 2026-10-18). The push aggregate on the Dependabot branch is
    # authoritative — it reads the Dependabot secret store and runs the full
    # E2E, and `automerge.yml` waits for exactly `CI gate (push)`.
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')) }}
    needs:
      - security-contract
      - ratchet
      - backend
      - backend-postgres
      - cutover-copy
      - frontend
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency to succeed
        env:
          SECURITY_CONTRACT_RESULT: ${{ needs.security-contract.result }}
          RATCHET_RESULT: ${{ needs.ratchet.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_POSTGRES_RESULT: ${{ needs.backend-postgres.result }}
          CUTOVER_COPY_RESULT: ${{ needs.cutover-copy.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          [[ "$SECURITY_CONTRACT_RESULT" == "success" ]]
          [[ "$RATCHET_RESULT" == "success" ]]
          [[ "$BACKEND_RESULT" == "success" ]]
          [[ "$BACKEND_POSTGRES_RESULT" == "success" ]]
          [[ "$CUTOVER_COPY_RESULT" == "success" ]]
          [[ "$FRONTEND_RESULT" == "success" ]]
          [[ "$E2E_RESULT" == "success" ]]
