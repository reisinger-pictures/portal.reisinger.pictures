name: Verify consumed image tags are fresh

# INFRA-10: base-image.yml and e2e-image.yml push mutable tags, and since the
# owner decision of 2026-09-26 the CI/production consumers pin a concrete tag
# (no `latest`) instead of an immutable digest. A mutable tag delivers rebuilds
# automatically, but a workflow that silently stops rebuilding leaves an old
# artifact behind the tag with no consumer-visible change. This gate resolves the
# artifact each consumed tag currently points at, reads its published `created`
# timestamp and fails when the artifact is older than the documented maximum age.
#
# Policy and exit contract: tests/infrastructure/verify-image-freshness.sh
# and deployment/image-pin-freshness.md.
on:
  schedule:
    # Daily, just after the base/e2e image rebuild schedules (01:00/02:00 UTC).
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'deployment/docker-compose.yml'
      - '.github/workflows/ci.yml'
      - 'tests/infrastructure/verify-image-freshness.sh'
      - '.github/workflows/image-freshness.yml'

# Least privilege: the gate only reads the repository and the public registry.
permissions:
  contents: read

concurrency:
  group: image-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Consumed image tag freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the consumed tags point at fresh artifacts
        run: bash tests/infrastructure/verify-image-freshness.sh
