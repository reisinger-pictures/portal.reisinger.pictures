get:
  operationId: getVatReturn
  summary: Monthly USt return with the eight Kennzahlen and the Zahllast
  description: |
    Maps booked entries and the tenant's #27 VAT types onto the integer-cent
    inputs of the pure B07 engine (EUE-082…086). Business income feeds KZ 016
    and KZ 000, reverse-charge tax feeds KZ 057 and the four IG-Erwerb types
    feed KZ 072/073/008/125; KZ 070 is their subtotal. Every SUMIFS that is zero
    stays blank (`null`). Rate products are truncated toward zero once, in
    integer cents; no euro float is used. Tenant-scoped and read-only.
  parameters:
    - name: year
      in: query
      required: true
      schema: { type: integer, enum: [2024, 2025, 2026] }
    - name: month
      in: query
      required: true
      schema: { type: integer, minimum: 1, maximum: 12 }
  responses:
    '200':
      description: One month's Kennzahlen and Zahllast in integer cents.
      content:
        application/json:
          schema:
            type: object
            required: [year, month, period, codes, kennzahlen, zahllast_cents, empty]
            properties:
              year: { type: integer }
              month: { type: integer }
              period: { type: string, example: '2026-05' }
              codes:
                type: array
                items: { type: string, enum: ['000', '016', '057', '070', '072', '073', '008', '125'] }
              labels: { type: object, additionalProperties: { type: string } }
              kennzahlen:
                type: object
                description: Null means the workbook's empty string for a zero SUMIFS.
                additionalProperties: { type: integer, nullable: true }
              zahllast_cents: { type: integer, nullable: true }
              empty: { type: boolean }
              field_help: { type: object }
    '422':
      $ref: '#/components/responses/Validation'
