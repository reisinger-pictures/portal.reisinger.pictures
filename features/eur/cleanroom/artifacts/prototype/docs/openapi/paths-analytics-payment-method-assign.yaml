post:
  operationId: assignEntryPaymentMethod
  summary: Assign a payment method to an existing booking
  description: |
    Thin W3 adapter: ReportRepository owns the entries INSERT and has no
    payment-method argument, so this endpoint writes only the tenant-scoped
    `entries.payment_method` column added in db/schema.sql. No money value is
    changed. An unknown method is kept (with a ⚠ warning) so the ZA
    completeness check can report the orphaned cents instead of hiding them.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [entry_id, payment_method]
          properties:
            entry_id: { type: integer, minimum: 1 }
            payment_method: { type: string, maxLength: 64 }
  responses:
    '200':
      description: Assignment stored.
      content:
        application/json:
          schema:
            type: object
            required: [entry_id, payment_method, known, warnings]
            properties:
              entry_id: { type: integer }
              payment_method: { type: string }
              known: { type: boolean }
              warnings: { type: array, items: { type: string } }
    '403':
      $ref: '#/components/responses/Forbidden'
    '422':
      $ref: '#/components/responses/Validation'
