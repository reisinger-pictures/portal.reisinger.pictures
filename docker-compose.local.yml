services:
  search:
    image: getmeili/meilisearch:v1.48.3@sha256:c1a52f17c759c2cd6349eede3d5108b8dac07b97e10665b1d64a2d4961c2fd29
    container_name: portal_search_local
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local_meili_secret
    ports: ["7700:7700"]
    volumes: ["search_data_local:/meili_data"]

volumes:
  search_data_local:
