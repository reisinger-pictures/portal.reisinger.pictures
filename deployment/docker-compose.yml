version: '3.8'

services:
  db:
    image: mariadb:11.4
    container_name: portal_db
    restart: unless-stopped
    # PITR statt 24h-Datenverlust. log_bin war OFF, damit gab es keine
    # Binlogs und bei einem Desaster nur den Tages-Dump -> groesster
    # moeglicher Verlust 24 Stunden. Am 2026-09-28 verifiziert:
    # log_bin=ON, binlog_format=ROW, binlog_expire_logs_seconds=604800.
    #   ROW ist hier richtig: zeilenbasiert, damit ein Replay determinis-
    #   tisch ist und nicht von Tabellenscan-Reihenfolge abhaengt.
    #   7 Tage Aufbewahrung lokal; die Sicherung der Binlogs uebernimmt
    #   das Backup, sonst waeren sie nach 7 Tagen weg.
    # ACHTUNG 1: log_bin ist ein Startparameter -> erfordert Recreate des
    # db-Dienstes, nicht nur Restart.
    # ACHTUNG 2: Diese Datei ist die Quelle, aber sie laeuft nicht direkt.
    # Portainer haelt eine eigene Kopie in portainer.db, und ein Stack-Update
    # ueber die Portainer-UI deployt von dort — es wuerde diese Einstellung
    # also wieder entfernen. Nach jeder Aenderung an dieser Datei den Stack 23
    # in Portainer aktualisieren und den db-Dienst recreaten.
    command:
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: portal_db
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: "15s"
      timeout: 5s
      retries: 10
    networks:
      - portal_internal

  search:
    image: getmeili/meilisearch:v1.48.3
    container_name: portal_search
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - search_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: "15s"
      timeout: 5s
      retries: 5
    networks:
      - portal_internal

  composer_init:
    image: composer:2.10.3
    user: "1000:1000"
    container_name: portal_composer
    volumes:
      - /home/webadmin/websites/api-portal.reisinger.pictures:/app:Z
    command: install --ignore-platform-reqs --no-interaction --optimize-autoloader

  backend:
    image: ghcr.io/reisinger-pictures/portal-base:8.5
    # UID 1000 (Host-Konvention des Website-Baums), GID 82 = webgroup.
    # D-1/D-2: `FtpController::process()` legt das Inbox-Verzeichnis an und
    # `unlink`t die Datei danach wieder. In einem 2775+setgid-Verzeichnis
    # kann UID 1000 das nur ueber die Gruppe. Start-Guard weiter unten
    # (GID-Zeile) muss mit dieser Zahl uebereinstimmen.
    user: "1000:82"
    container_name: portal_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
      composer_init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    volumes:
      - /home/webadmin/websites/api-portal.reisinger.pictures:/var/www/html:Z
      - /home/webadmin/portal/images:/var/www/photos:Z
      - /home/webadmin/websites/ftp:/var/www/ftp:Z
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-mariadb}
      - DB_HOST=db
      # SFTPGo Admin-API (P1-M22). Der Backend provisioniert FTP-Konten ueber
      # diese URL. Der API-Key kommt aus der Portainer-Stack-Env; ohne ihn
      # faellt der Client auf den JWT-Pfad zurueck, der ebenfalls die
      # Admin-Credentials braucht.
      - SFTPGO_BASE_URL=${SFTPGO_BASE_URL:-http://sftpgo:8080}
      - SFTPGO_API_KEY=${SFTPGO_API_KEY:-}
      # JWT-Fallback, wenn kein API-Key gesetzt ist. config/services.php
      # liest genau diese zwei Namen; ohne sie bleibt der Admin-Token leer
      # und die Provisionierung laeuft ins Leere.
      - SFTPGO_ADMIN_USERNAME=${SFTPGO_ADMIN_USERNAME:-}
      - SFTPGO_ADMIN_PASSWORD=${SFTPGO_ADMIN_PASSWORD:-}
      # Kameraseitige Verbindungsdaten fuer die Anzeige im Management-UI.
      # Gleiche Variablen, die der sftpgo-Service als Host-Ports benutzt, damit
      # die Anzeige nicht von der Wirklichkeit abweichen kann. Pflicht ohne
      # Default: ein fehlender Wert wird als `configured: false` gemeldet, nicht
      # still ersetzt (AGENTS 8, Security-Review C1/C2).
      - FTP_PUBLIC_HOST=${FTP_PUBLIC_HOST}
      - SFTPGO_SFTP_PORT=${SFTPGO_SFTP_PORT}
      - SFTPGO_FTPS_PORT=${SFTPGO_FTPS_PORT}
      - SFTPGO_PASV_PORT_START=${SFTPGO_PASV_PORT_START}
      - SFTPGO_PASV_PORT_END=${SFTPGO_PASV_PORT_END}
      - SFTPGO_FTPD_TLS_MODE=${SFTPGO_FTPD_TLS_MODE}
      # Der Unterordner, den die Kamera beschreibt. '/' ist das Konto-
      # Wurzelverzeichnis und der korrekte Wert, solange eine Zielgalerie
      # alles nimmt, was ankommt. Anders als Host und Ports ist ein Default
      # hier ehrlich: '/' ist nicht geraten, sondern richtig.
      - FTP_UPLOAD_PATH=${FTP_UPLOAD_PATH:-/}
      - DB_DATABASE=portal_db
      - DB_USERNAME=portal_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_QUEUE_CONNECTION=${DB_QUEUE_CONNECTION:-mariadb}
      - DB_QUEUE_RETRY_AFTER=${DB_QUEUE_RETRY_AFTER:-90}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - QUEUE_FAILED_DRIVER=${QUEUE_FAILED_DRIVER:-database-uuids}
      - QUEUE_WORKER_TIMEOUT=${QUEUE_WORKER_TIMEOUT:-60}
      - QUEUE_WORKER_RESTART_DELAY=${QUEUE_WORKER_RESTART_DELAY:-5}
      - APP_ENV=${APP_ENV:-production}
      # Default false: never enable debug by accident in production.
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - APP_KEY=${APP_KEY}
      - JWT_SECRET=${JWT_SECRET}
      # Separater Key für die verschlüsselte Ablage sensibler Model-Dateien
      # (Altersnachweis/Fotos) + answers-Snapshots. Rotation via
      # FILE_ENCRYPTION_PREVIOUS_KEYS.
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY}
      - FILE_ENCRYPTION_PREVIOUS_KEYS=${FILE_ENCRYPTION_PREVIOUS_KEYS}
      - LOG_CHANNEL=stderr
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ACCOUNTING_EMAIL=${ACCOUNTING_EMAIL}
      # ---
      # E-Mail-Versand (SMTP via ZeptoMail, Migration vom Gmail-REST-OAuth am 2026-08-24)
      # Konfiguration liegt in .env.production:
      #   MAIL_MAILER=smtp
      #   MAIL_SCHEME=smtp
      #   MAIL_REQUIRE_TLS=true
      #   MAIL_HOST=smtp.zeptomail.eu
      #   MAIL_PORT=587
      #   MAIL_USERNAME=emailapikey
      #   MAIL_PASSWORD=<ZeptoMail-API-Key>
      #   MAIL_FROM_ADDRESS=noreply@reisinger.pictures
      # Der Gmail-REST-OAuth-Transport (GmailRestTransport) bleibt als Fallback
      # im Code erhalten; OAUTH_*-Secrets sind aus dem PROD-Setup entfernt.
      # ---
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_SCHEME=${MAIL_SCHEME}
      - MAIL_REQUIRE_TLS=${MAIL_REQUIRE_TLS:-true}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      # Scheduler mutexes must use a store shared by every backend replica.
      # The provisioned MariaDB store is the current production default.
      - CACHE_STORE=${CACHE_STORE:-database}
      - DB_CACHE_CONNECTION=${DB_CACHE_CONNECTION:-mariadb}
      - DB_CACHE_LOCK_CONNECTION=${DB_CACHE_LOCK_CONNECTION:-mariadb}
      - MAKE_WEBHOOK_URL=${MAKE_WEBHOOK_URL}
      - MAKE_API_KEY=${MAKE_API_KEY}
      - MEILISEARCH_HOST=http://search:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY}
      - GALLERY_CLEANUP_GRACE_MONTHS=${GALLERY_CLEANUP_GRACE_MONTHS}
      - AUTH_THROTTLE_LIMIT=10
      - DOWNLOAD_THROTTLE=120
      - ZIP_DOWNLOAD_THROTTLE=10
      - CHECKOUT_THROTTLE_USER_PER_HOUR=${CHECKOUT_THROTTLE_USER_PER_HOUR:-5}
      - CHECKOUT_THROTTLE_IP_PER_HOUR=${CHECKOUT_THROTTLE_IP_PER_HOUR:-10}
      - CHECKOUT_THROTTLE_IP_PER_DAY=${CHECKOUT_THROTTLE_IP_PER_DAY:-30}
      - CHECKOUT_IDEMPOTENCY_TTL_MINUTES=${CHECKOUT_IDEMPOTENCY_TTL_MINUTES:-30}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_ALLOWED_HOSTNAMES=${TURNSTILE_ALLOWED_HOSTNAMES:-}
      - TURNSTILE_USER_THRESHOLD_PER_HOUR=${TURNSTILE_USER_THRESHOLD_PER_HOUR:-3}
      - TURNSTILE_IP_THRESHOLD_PER_HOUR=${TURNSTILE_IP_THRESHOLD_PER_HOUR:-5}
      - TURNSTILE_FAILURE_USER_THRESHOLD_PER_HOUR=${TURNSTILE_FAILURE_USER_THRESHOLD_PER_HOUR:-3}
      - TURNSTILE_FAILURE_IP_THRESHOLD_PER_HOUR=${TURNSTILE_FAILURE_IP_THRESHOLD_PER_HOUR:-5}
      - TURNSTILE_FAILURE_WINDOW_SECONDS=${TURNSTILE_FAILURE_WINDOW_SECONDS:-3600}
      - FTP_STORAGE_PATH=/var/www/ftp
      - STRIPE_KEY=${STRIPE_KEY}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CHECKOUT_NEW_ACCOUNT_HOURS=${STRIPE_CHECKOUT_NEW_ACCOUNT_HOURS:-24}
      - STRIPE_CHECKOUT_ENABLED=${STRIPE_CHECKOUT_ENABLED:-true}
      - STRIPE_STALE_PAYMENT_INTENT_HOURS=${STRIPE_STALE_PAYMENT_INTENT_HOURS:-2}
      - STRIPE_CUSTOMERS_ENABLED=${STRIPE_CUSTOMERS_ENABLED:-true}
      - PROXY_DELIVERY_HEADER=${PROXY_DELIVERY_HEADER}
      - PHOTO_STORAGE_PATH=${PHOTO_STORAGE_PATH}
      - AI_ENABLED=${AI_ENABLED}
      - AI_TYPE=${AI_TYPE}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      # Unset-only defaults keep an explicit empty header as the opt-out.
      - AI_SESSION_HEADER=${AI_SESSION_HEADER-x-opencode-session}
      - AI_SESSION_PREFIX=${AI_SESSION_PREFIX-portal-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          kill -0 1 2>/dev/null &&
          grep -q php-fpm /proc/1/cmdline &&
          test -s /tmp/portal-queue-supervisor.pid &&
          test -s /tmp/portal-queue-worker.pid &&
          test -s /tmp/portal-scheduler.pid &&
          kill -0 "$$(cat /tmp/portal-queue-supervisor.pid)" 2>/dev/null &&
          kill -0 "$$(cat /tmp/portal-queue-worker.pid)" 2>/dev/null &&
          kill -0 "$$(cat /tmp/portal-scheduler.pid)" 2>/dev/null
      interval: "30s"
      timeout: 10s
      retries: 3
      start_period: 90s
    # WICHTIG: Kommentare duerfen NIEMALS innerhalb des `command:`-Blocks
    # stehen. `command: >` ist ein gefalteter Skalar, alle Zeilen werden zu
    # EINER Zeile verbunden, und `sh` faengt an einem `#` mitten in der Zeile
    # den Kommentar an — der frisst dann den Rest der Zeile, also
    # for-Schleife, migrate und exec. Genau das war die Restart-Schleife vom
    # 2026-09-26. Siehe features/infrastructure/01-deployment.md 9.
    #
    # Bewusst NUR Existenz + Schreibbarkeit fuer die laufende UID, kein
    # Ownership-Vergleich: 19-ftp 7.9 verbietet das Umstellen von
    # /home/webadmin/websites auf 1000:1000, der Host haelt 1002:webgroup
    # mit 2775+setgid. Ein stat-Vergleich auf die Backend-Identitaet waere
    # damit unerfuellbar, ohne die bindende Regel zu brechen. Die Identitaet
    # selbst ist weiterhin ueber die `user:`-Zeile dieses Stanzas erzwungen:
    # UID 1000, GID 82. D-1/D-2, 2026-09-29 — vorher stand dort 1000:1000,
    # und genau diese fehlende Gruppenzugehoerigkeit waere der Grund gewesen,
    # aus dem `FtpController::process()` das Anlegen bzw. `unlink`en in einem
    # 2775+setgid-Inbox-Verzeichnis scheitert. Die GID-Zeile des Guards
    # weiter unten muss dieselbe Zahl nennen, sonst verweigert der Container
    # den Start.
    # ACHTUNG — zwei Compose-v5-Fallen in diesem Block, beide schon produktiv
    # aufgefallen. 1) KEIN `#` innerhalb von `command:`, auch nicht als
    # Kommentar: `command: >` ist ein gefalteter Skalar, alle Zeilen werden zu
    # EINER Zeile, und `sh` beginnt ab einem `#` mitten in der Zeile den
    # Kommentar — der frisst for-Schleife, migrate und exec (Restart-Schleife
    # vom 2026-09-26). 2) KEIN `$` ausser in `$(...)`, und auch dort ist es
    # kaputt: Compose v5.0.2 gibt JEDE Command-Substitution als `$$(...)` aus,
    # auch wenn in der Datei schon `$$` steht. Der Container-Shell expandiert
    # `$$` dann zur PID — aus `[ "$$(id -u)" -ne 1000 ]` wird
    # `[ "1(id -u)" -ne 1000 ]`, also `Illegal number` und FATAL. Ebenso
    # werden `$${APP_ENV}` zu `1234{APP_ENV}`. Nachgewiesen mit
    # Docker Compose v5.0.2; `$$` wirkt in KEINER YAML-Form. Deshalb liest
    # dieser Guard ueber `printenv | grep` und `xargs -I{}` statt ueber
    # Variablen-Expansion, und verzichtet auf `${VAR}` komplett: das wuerde
    # Secrets zur Compose-Interpolationszeit in `docker inspect Cmd` schreiben.
    #
    # Gegenprobe vor jedem Deploy (siehe deployment/README.md):
    #   docker compose config --format json | grep -c '\$\$'   -> muss 0 sein
    command: >
      sh -c "
      id -u | grep -qx 1000 || { echo 'FATAL: Backend muss als UID 1000 laufen. Start verweigert (fail-closed)!'; exit 1; };
      id -g | grep -qx 82 || { echo 'FATAL: Backend muss als GID 82 (webgroup) laufen. Start verweigert (fail-closed)!'; exit 1; };
      printenv APP_ENV | grep -qx production || { echo 'FATAL: APP_ENV muss im Produktions-Stack production sein. Start verweigert (fail-closed)!'; exit 1; };
      printenv APP_KEY | grep -q . || { echo 'FATAL: APP_KEY ist nicht gesetzt. Start verweigert (fail-closed)!'; exit 1; };
      printenv JWT_SECRET | grep -q . || { echo 'FATAL: JWT_SECRET ist nicht gesetzt. Start verweigert (fail-closed)!'; exit 1; };
      printenv FILE_ENCRYPTION_KEY | grep -q . || { echo 'FATAL: FILE_ENCRYPTION_KEY ist nicht gesetzt. Start verweigert (fail-closed)!'; exit 1; };
      printenv ADMIN_EMAIL | grep -q . || { echo 'FATAL: ADMIN_EMAIL ist nicht gesetzt. Start verweigert (fail-closed)!'; exit 1; };
      printenv ADMIN_PASSWORD | grep -q . || { echo 'FATAL: ADMIN_PASSWORD ist nicht gesetzt. Start verweigert (fail-closed)!'; exit 1; };
      printenv PHOTO_STORAGE_PATH | grep -q . || { echo 'FATAL: PHOTO_STORAGE_PATH ist nicht gesetzt. Start verweigert (fail-closed)!'; exit 1; };
      printenv PHOTO_STORAGE_PATH | grep -q '^/' || { echo 'FATAL: PHOTO_STORAGE_PATH muss ein absoluter Mount-Pfad sein. Start verweigert!'; exit 1; };
      printenv AI_SESSION_HEADER | grep -qE '^[A-Za-z0-9-]*$' || { echo 'FATAL: AI_SESSION_HEADER darf nur Buchstaben, Ziffern und Bindestriche enthalten. Start verweigert (fail-closed)!'; exit 1; };
      printenv AI_SESSION_PREFIX | grep -qE '^[A-Za-z0-9._-]*$' || { echo 'FATAL: AI_SESSION_PREFIX darf nur Buchstaben, Ziffern, Punkt, Unterstrich und Bindestrich enthalten. Start verweigert (fail-closed)!'; exit 1; };
      [ -d /var/www/html ] && [ -w /var/www/html ] || { echo 'FATAL: /var/www/html fehlt oder ist fuer UID 1000 nicht schreibbar. Start verweigert!'; exit 1; };
      [ -d /var/www/ftp ] && [ -w /var/www/ftp ] || { echo 'FATAL: /var/www/ftp fehlt oder ist fuer UID 1000 nicht schreibbar. Start verweigert!'; exit 1; };
      printenv PHOTO_STORAGE_PATH | xargs -r -I{} test -d {} || { echo 'FATAL: PHOTO_STORAGE_PATH ist kein Verzeichnis. Start verweigert!'; exit 1; };
      printenv PHOTO_STORAGE_PATH | xargs -r -I{} test -w {} || { echo 'FATAL: PHOTO_STORAGE_PATH ist fuer UID 1000 nicht schreibbar. Start verweigert!'; exit 1; };
      [ -x /usr/local/bin/validate-production-env ] && [ -x /usr/local/bin/portal-backend-supervisor ] || { echo 'FATAL: Production preflight/supervisor is missing. Rebuild portal-base:8.5, push GHCR, update the pinned compose tag, then redeploy. No migration or seed was run.'; exit 1; };
      /usr/local/bin/validate-production-env || exit 1;
      php artisan cache:clear || exit 1;
      php artisan optimize || exit 1;
      php artisan ops:validate-production || exit 1;
      php artisan migrate --force && php artisan app:seed-if-fresh && php artisan admin:update || exit 1;
      php artisan ftp:provision-folders --fix-permissions || exit 1;
      php artisan scout:sync-index-settings || exit 1;
      php artisan queue:restart || exit 1;
      echo 'Starte Supervisor...';
      exec /usr/local/bin/portal-backend-supervisor
      "
    networks:
      portal_internal:
      webnet:
        ipv4_address: 172.18.0.31

  # Ersetzt pure-ftpd als Datei-Transport fuer Kameras (P1-M22 ff.).
  # Drei Portklassen mit unterschiedlicher Erreichbarkeit — das ist der
  # entscheidende Punkt, siehe features/infrastructure/19-ftp-upload-pipeline.md
  # 7.13 (Port-Erreichbarkeit) und 7.12 (Cutover-Runbook).
  sftpgo:
    # Gepinnt auf die Minor-Reihe 2.7. Bewusst NICHT `latest` und NICHT `v2`:
    # `latest` zeigt auf den Build vom 2026-09-18, `2.7.x` wird dagegen laufend
    # neu gebaut und bekommt damit Bugfixes automatisch — springt aber nie
    # auf 2.8, was das Config-Format mitbringt. Stand 2026-09-26 ist v2.7.6
    # die neueste Release (2026-09-19). Begründung: 19-ftp 7.13.
    image: drakkan/sftpgo:2.7.x
    container_name: portal_sftpgo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    volumes:
      # Schreibzugriff auf denselben Host-Baum, den der Backend-Container als
      # ftp_inbox liest. Ownership-Regeln: features/... 19-ftp 7.9.
      - /home/webadmin/websites/ftp:/var/www/ftp:Z
      # Persistenter Datenprovider (SQLite) + Config. OHNE dieses Volume ist die
      # Instanz nach jedem Neustart ohne Admin-User und ohne Konten — dann gibt
      # /api/v2/token 401 und die Provisionierung aus P1-M22 laeuft nicht.
      - sftpgo_data:/var/lib/sftpgo
    environment:
      # Admin-Bootstrap. Ohne `CREATE_DEFAULT_ADMIN=true` bleibt die admins-Tabelle
      # leer und /api/v2/token antwortet 401 — die Provisionierung aus P1-M22
      # laeuft dann ins Leere. `SFTPGO_DEFAULT_ADMIN_PERMISSIONS` existiert in
      # 2.7.x nicht mehr und wird stillschweigend ignoriert.
      - SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN=true
      # SFTPGo 2.7 startet den FTP-Daemon mit `Bindings:[{Port:0}]`, also
      # voellig aus. Ohne diese drei Zeilen lauscht auf 989 nichts, der
      # Host-Port liefert nur ein TCP-RST, und die Kamera sieht einen
      # Verbindungsfehler ohne erkennbare Ursache. Nachgewiesen am 2026-09-26:
      # im Container lauschten nur 2022 und 8080.
      # Der Praefix lautet `FTPD__`, nicht `FTP__`: seit 2.6 heisst der
      # Config-Abschnitt `ftpd` (Default-Datei /etc/sftpgo/sftpgo.json:
      # `"ftpd": {...}`). Mit `FTP__` wird die Variable kommentarlos
      # ignoriert — die Konfiguration sah dann korrekt aus und der Port
      # blieb trotzdem tot.
      #
      # TLS_MODE=1 ist **explizites** TLS: der Server begruesst mit
      # `220 SFTPGo_2.7.6` im Klartext und schaltet auf `AUTH TLS` um. Das ist
      # genau der Ablauf, den eine Canon-Kamera erwartet (cam.start.canon,
      # UG-06_Network_0060: die Kamera sendet direkt nach dem Verbindungsaufbau
      # `AUTH TLS`; implizites FTPS wird nicht zuverlaessig unterstuetzt).
      # Werte laut SFTPGo-Doku und `ftpd`-Paket: 0 = aus, 1 = explizit,
      # 2 = implizit. Implizit zu waehlen war der naheliegende Fehlschluss: der
      # Klartext-Greeting sah nach einem Fehler aus und war es nicht.
      #
      # Fuer einen zweiten, explizit unverschluesselten Zugriffsweg gibt es
      # keine Abschaltung: `AUTH` ist optional, ein Client kann die TLS-Stufe
      # auch auslassen. Das entspricht dem FTP-Standard und dem Verhalten der
      # Kamera, ist aber eine bewusste Entscheidung und keine Konfigurations-
      # nachlaessigkeit — wer FTPS erzwingen will, braegt eine Firewall-Regel
      # auf 989 ohne 21.
      - SFTPGO_FTPD__BINDINGS__0__ADDRESS=0.0.0.0
      - SFTPGO_FTPD__BINDINGS__0__PORT=989
      # Aus der Stack-Env, damit die Anzeige im Management-UI nicht etwas
      # behauptet, was der Dienst nicht tut. Default 1 = explizit, weil eine
      # Canon-Kamera direkt nach dem Verbindungsaufbau AUTH TLS sendet
      # (cam.start.canon UG-06_Network_0060).
      - SFTPGO_FTPD__BINDINGS__0__TLS_MODE=${SFTPGO_FTPD_TLS_MODE:-1}
      # KEINE Max-TLS-Version gesetzt, und das ist Absicht. Go bietet TLS 1.3
      # an und handelt mit einem aelteren Client von selbst auf dessen hoechste
      # Version herunter — eine Kamera, die nur 1.2 kann, bekommt 1.2. Eine
      # Obergrenze wuerde hier nur Faehigkeit wegnehmen und nichts hinzufuegen;
      # sie war ein Kurzschluss aus der Beobachtung, dass der Kontrolltest
      # TLS 1.3 negotiated. Nachgewiesen ist beides: `openssl s_client -tls1_2`
      # und ein 1.3-Client handshake beide gegen dieselbe Bindung.
      # SFTPGo 2.7 erzeugt im Gegensatz zu 19-ftp 7.9 KEIN Zertifikat
      # selbst. Ohne diese beiden Pfade bricht der Start ab mit
      # "could not start FTP server: to enable TLS you need to provide a
      # certificate" und der Container restartet in einer Schleife. Das
      # Zertifikat wird deshalb beim ersten Start selbstsigniert erzeugt und
      # im persistenten Dataprovider-Volume abgelegt, damit es einen Neustart
      # und einen Stack-Redeploy ueberlebt. Die Kamera akzeptiert
      # selbstsignierte Zertifikate (19-ftp 7.9), der CN ist rein kosmetisch
      # und wird deshalb nicht als Konfiguration hierher geschrieben.
      - SFTPGO_FTPD__BINDINGS__0__CERTIFICATE_FILE=/var/lib/sftpgo/ftps/cert.pem
      - SFTPGO_FTPD__BINDINGS__0__CERTIFICATE_KEY_FILE=/var/lib/sftpgo/ftps/key.pem
      # Passive Range explizit, aus denselben Variablen wie der Publish unten.
      # Bisher hing sie an SFTPGOs Default, der zufaellig genau 50000-50100 ist —
      # ein Default, der sich mit einem SFTPGo-Update ohne Vorwarnung mitbewegt
      # und dann genau den stillen Fehler erzeugt, den diese Range verursacht
      # (Handshake ok, Upload bricht ab). Die Harness
      # tests/scripts/ftp-transport-test/docker-compose.yml macht es genauso.
      - SFTPGO_FTPD__PASSIVE_PORT_RANGE__START=${SFTPGO_PASV_PORT_START:-50000}
      - SFTPGO_FTPD__PASSIVE_PORT_RANGE__END=${SFTPGO_PASV_PORT_END:-50100}
      # SSH-Bindung: SFTPGo 2.7 lauscht auf 2022 (Publish weiter unten als 2222).
      # Die Adresse explizit, damit der Wildcard nicht vom Default abhaengt.
      - SFTPGO_SFTPD__BINDINGS__0__ADDRESS=0.0.0.0
      # SFTPGo liest eigene Bootstrap-Namen, die nicht in .env.production
      # stehen. Sie sind dasselbe Geheimnis wie SFTPGO_ADMIN_* (backend-Block
      # weiter oben), das backend/config/services.php fuer den JWT-Fallback
      # liest — deshalb hier gemappt statt ein zweites Wertepaar in der
      # Portainer-GUI zu pflegen. Deklariert wie die 31 anderen
      # Pflicht-Secrets als bare ${VAR}: fehlt der Wert, bricht Compose mit
      # Namensnennung ab, statt SFTPGo mit leerem Admin in eine
      # Restart-Schleife laufen zu lassen ("no admins found" im Log).
      - SFTPGO_DEFAULT_ADMIN_USERNAME=${SFTPGO_ADMIN_USERNAME}
      - SFTPGO_DEFAULT_ADMIN_PASSWORD=${SFTPGO_ADMIN_PASSWORD}
    # Erzeugt das FTPS-Zertifikat einmalig und startet dann SFTPGo.
    #
    # `sftpgo serve` ist zwingend: das Image-Default ist `["sftpgo","serve"]`, und
    # blankes `sftpgo` druckt nur die Hilfe und beendet sich mit Exit 0 — der
    # Container restartet dann scheinbar grundlos ohne einen Listener.
    #
    # Listenform statt `command: >`, und darin ein Literal-Block `|` statt eines
    # gefalteten `>-`: bei `>-` behalten staerker eingerueckte Folgezeilen ihren
    # Zeilenumbruch, das Kommando zerfiel in `sh: -keyout: not found` und
    # SFTPGo wurde nie gestartet. Jede Zeile des Skripts steht deshalb hier
    # buendig und der openssl-Aufruf bleibt einzeilig.
    #
    # Weiterhin gilt: kein `#` und kein `$` im Command. Compose v5.0.2 ersetzt
    # jedes `$(` durch `$$(`, und die Shell im Container expandiert `$$` zur PID
    # (ausfuehrlich am backend-command). Das Zertifikat liegt im
    # Dataprovider-Volume, nicht im websites-Baum, es beruehrt also nichts, was
    # 19-ftp 7.9 verbietet.
    command:
      - sh
      - -c
      - |
        if [ ! -f /var/lib/sftpgo/ftps/cert.pem ]; then
          mkdir -p /var/lib/sftpgo/ftps && openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=sftpgo -keyout /var/lib/sftpgo/ftps/key.pem -out /var/lib/sftpgo/ftps/cert.pem;
        fi;
        exec sftpgo serve
    ports:
      # --- Oeffentlich erreichbar: der Kamera-Zugang ---
      # FTPS (explizites TLS) und SFTP (SSH). Beide muessen von aussen
      # erreichbar sein, sonst erreicht die Kamera den Server nicht. SFTPGo
      # bietet FTPS und SFTP auf demselben Port; getrennte Ports hier, weil
      # die Kamera genau eines der beiden spricht und der jeweils andere
      # geschlossen bleiben kann.
      # Links der kameraseitige Port, rechts der Container-Port. SFTPGo 2.7
      # lauscht mit SSH auf 2022; `2222:2222` hat auf dem Host einen
      # docker-proxy gebunden, im Container aber niemand — das Ergebnis war
      # ein RST auf dem Host-Port. FTPS laeuft nach der Aktivierung oben auf
      # 989, dort passt die Zahl zufaellig auf beiden Seiten.
      - "${SFTPGO_SFTP_PORT:-2222}:2022"
      - "${SFTPGO_FTPS_PORT:-989}:989"
      # Passive-Ports fuer FTPS. Ohne diese Range bricht der Datenkanal:
      # der Client verbindet sich auf 989, der Server antwortet aus diesem
      # Bereich. Bei Kameras ist das der haeufigste Stillschweizgrund.
      - "${SFTPGO_PASV_PORT_START:-50000}-${SFTPGO_PASV_PORT_END:-50100}:50000-50100"
    networks:
      # NUR portal_internal. Der HTTP-/Admin-API-Port wird bewusst NICHT
      # per `ports:` veroeffentlicht: auf `expose` fehlt, er ist damit nur
      # ueber das Docker-Netz erreichbar. Das Portal spricht ihn als
      # http://sftpgo:8080 an. Wer den Port im Stack publicly machen will,
      # muss das als eigenen Change begruenden — er ist die Schnittstelle, ueber
      # die Konten angelegt und Passwoerter gesetzt werden.
      # Bewusst KEIN ipv4_address. Das Netz `portal_internal` existiert bereits
      # aus dem Stack und sein Subnetz ist nicht 172.18.0.0/16; eine dort
      # gepinnte Adresse bricht den Deploy mit "no configured subnet contains IP
      # address". Auf portal_internal wird nichts gepinnt — der Dienstname
      # `sftpgo` loest per Docker-DNS auf, eine feste IP wird nicht gebraucht.
      # Der Backend pinnt seine IP nur auf webret, weil Caddy darauf routet.
      - portal_internal
    # Non-root wie der Backend (verify-image-nonroot.sh ist CI-Gate).
    # Der Host-Pfad gehoert 1002:webgroup mit setgid, NICHT 1000:1000:
    # features/infrastructure/19-ftp-upload-pipeline.md 7.9 verbietet
    # ausdruecklich, /home/webadmin/websites per chown -R auf 1000
    # umzuschreiben (Vorfall 2026-09-26: 38.969 Dateien). uid 1000 schreibt
    # in 2775+setgid trotzdem, und neue Dateien erben die Gruppe webgroup —
    # genau das soll 7.9. Deshalb wird hier nichts gechownt, weder von hier
    # noch aus dem Backend-Entrypoint.
    user: "1002:82"

networks:
  webnet:
    external: true
  portal_internal:

volumes:
  db_data:
  search_data:
  sftpgo_data: